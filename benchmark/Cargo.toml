[package]
name = "harvest-benchmark"
version = "0.1.0"
edition = "2021"
description = "Runs a set of benchmarks and provides useful output"
license = "MIT"

[lib]
name = "harvest_benchmark"
path = "src/lib.rs"

[[bin]]
name = "benchmark"
path = "src/main.rs"

[dependencies]
agent_runner = { workspace = true }
cargo_metadata = "0.23.1"
clap = { workspace = true }
csv = "1.3"
full_source = { version = "0.1.0", path = "../tools/full_source" }
harvest-bench = { workspace = true }
harvest_core = { workspace = true }
harvest_readability = { workspace = true }
load_test_suite = { workspace = true }
harvest_translate = { workspace = true }
translate_agentic = { workspace = true }
verify_fix_agentic = { workspace = true }
quality_agentic = { workspace = true }
log = { workspace = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1.12.2"
serde = { workspace = true }
serde_json = { workspace = true }
syn = { version = "2", features = ["full", "visit"] }
tempfile = { workspace = true }
toml_edit = { workspace = true }
try_cargo_build = { version = "0.1.0", path = "../tools/try_cargo_build" }
wait-timeout = "0.2"
walkdir = "2.0"
