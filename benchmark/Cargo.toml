[package]
name = "harvest-benchmark"
version = "0.1.0"
edition = "2021"
description = "Runs a set of benchmarks and provides useful output"
license = "MIT"

[lib]
name = "harvest_benchmark"
path = "src/lib.rs"

[[bin]]
name = "benchmark"
path = "src/main.rs"

[dependencies]
agent_runner = { workspace = true }
build_project_spec = { version = "0.1.0", path = "../tools/build_project_spec" }
clap = { workspace = true }
csv = "1.3"
full_source = { version = "0.1.0", path = "../tools/full_source" }
harvest-bench = { git = "https://github.com/UW-HARVEST/harvest-bench", rev = "8aab38c5ff4d7bd1d510c9f83f54fb0a4f8cd3b9" }
harvest_core = { workspace = true }
load_test_suite = { workspace = true }
harvest_translate = { workspace = true }
log = { workspace = true }
regex = "1.12.2"
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
try_cargo_build = { version = "0.1.0", path = "../tools/try_cargo_build" }
wait-timeout = "0.2"
walkdir = "2.0"

[dev-dependencies]
tempfile = { workspace = true }
