# The clippy configuration of the two readability items that need types.
# Only the run that counts them uses it; the other clippy runs keep the
# default configuration.

# Item `c_integer_type_uses`: each use of a C integer type, by any path.
# `std::os::raw` defines its own aliases, so it is listed apart. libc
# re-exports or aliases the same names; `allow-invalid` keeps clippy quiet
# about a libc entry in a crate without libc.
disallowed-types = [
  "core::ffi::c_char",
  "core::ffi::c_schar",
  "core::ffi::c_uchar",
  "core::ffi::c_short",
  "core::ffi::c_ushort",
  "core::ffi::c_int",
  "core::ffi::c_uint",
  "core::ffi::c_long",
  "core::ffi::c_ulong",
  "core::ffi::c_longlong",
  "core::ffi::c_ulonglong",
  "std::os::raw::c_char",
  "std::os::raw::c_schar",
  "std::os::raw::c_uchar",
  "std::os::raw::c_short",
  "std::os::raw::c_ushort",
  "std::os::raw::c_int",
  "std::os::raw::c_uint",
  "std::os::raw::c_long",
  "std::os::raw::c_ulong",
  "std::os::raw::c_longlong",
  "std::os::raw::c_ulonglong",
  { path = "libc::size_t", allow-invalid = true },
  { path = "libc::ssize_t", allow-invalid = true },
  { path = "libc::ptrdiff_t", allow-invalid = true },
  { path = "libc::intptr_t", allow-invalid = true },
  { path = "libc::uintptr_t", allow-invalid = true },
  { path = "libc::int8_t", allow-invalid = true },
  { path = "libc::int16_t", allow-invalid = true },
  { path = "libc::int32_t", allow-invalid = true },
  { path = "libc::int64_t", allow-invalid = true },
  { path = "libc::uint8_t", allow-invalid = true },
  { path = "libc::uint16_t", allow-invalid = true },
  { path = "libc::uint32_t", allow-invalid = true },
  { path = "libc::uint64_t", allow-invalid = true },
  { path = "libc::c_char", allow-invalid = true },
  { path = "libc::c_schar", allow-invalid = true },
  { path = "libc::c_uchar", allow-invalid = true },
  { path = "libc::c_short", allow-invalid = true },
  { path = "libc::c_ushort", allow-invalid = true },
  { path = "libc::c_int", allow-invalid = true },
  { path = "libc::c_uint", allow-invalid = true },
  { path = "libc::c_long", allow-invalid = true },
  { path = "libc::c_ulong", allow-invalid = true },
  { path = "libc::c_longlong", allow-invalid = true },
  { path = "libc::c_ulonglong", allow-invalid = true },
]

# Item `raw_pointer_arithmetic_calls`: the arithmetic methods of raw
# pointers. The methods are resolved by type, so `add` on an integer or on
# another type does not count.
disallowed-methods = [
  "const_ptr::add",
  "const_ptr::sub",
  "const_ptr::offset",
  "const_ptr::offset_from",
  "const_ptr::wrapping_add",
  "const_ptr::wrapping_sub",
  "const_ptr::wrapping_offset",
  "const_ptr::byte_add",
  "const_ptr::byte_sub",
  "const_ptr::byte_offset",
  "mut_ptr::add",
  "mut_ptr::sub",
  "mut_ptr::offset",
  "mut_ptr::offset_from",
  "mut_ptr::wrapping_add",
  "mut_ptr::wrapping_sub",
  "mut_ptr::wrapping_offset",
  "mut_ptr::byte_add",
  "mut_ptr::byte_sub",
  "mut_ptr::byte_offset",
]
