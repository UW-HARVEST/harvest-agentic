# The experiment set for harvest-bench.
#
# This file IS the list of runs that should exist. Run it with:
#
#   cargo run --bin=benchmark --release -- --experiments experiments/hb.toml --dry-run
#   cargo run --bin=benchmark --release -- --experiments experiments/hb.toml
#   cargo run --bin=benchmark --release -- --experiments experiments/hb.toml --status
#
# --dry-run prints the resolved runs and the exact argv each becomes, without
# running anything: worth doing first, since a committed set is one paste away
# from declaring days of agent time. --status is read-only and safe to run from
# a second shell while a sweep is in progress.
#
# Conventions:
#   * bench_root / results_root / test_case resolve against THIS FILE, never the
#     process CWD.
#   * a run's output root is always <results_root>/<id>; no path is hand-typed.
#   * stages are listed in pipeline order.
#   * `from` consumes another declared run's output, so one frozen translate
#     snapshot can feed several verify experiments. The parent must be declared
#     earlier in the file.
#   * `labels` are free-form coordinates for table generation (issue #6). They
#     are recorded in each run's receipt, so a table's rows and columns come
#     from data rather than from parsing an id.
#
# bench_root assumes harvest-bench is cloned to ./harvest-bench, as the README
# describes. Adjust if yours lives elsewhere.

schema_version = 1
bench_root = "../harvest-bench/tests"
results_root = "../results/hb"

[defaults]
agent = "claude"
timeout = 60
config = ["tools.translate_agentic.timeout_secs=36000"]

# ---------------------------------------------------------------------------
# Non-agentic baselines. These are the control rows of any ablation table: the
# comparison is meaningless without them, so they belong in the declared set
# rather than being run by hand.
# ---------------------------------------------------------------------------

[[run]]
id = "one_shot"
labels = { pipeline = "one_shot" }
programs = ["lz4", "jansson"]

[[run]]
id = "modular"
labels = { pipeline = "modular" }
programs = ["lz4", "jansson"]
modular = true

# ---------------------------------------------------------------------------
# Translate once, then verify repeatedly against that frozen snapshot. This is
# the workflow the README describes, and the reason `from` exists: the verify
# experiments below all grade the SAME translation, so differences between them
# are attributable to the verify stage rather than to translation variance.
# ---------------------------------------------------------------------------

[[run]]
id = "t_sonnet"
labels = { pipeline = "agentic", tmodel = "sonnet" }
programs = ["lz4", "jansson"]
stages = ["translate"]
model = "sonnet"

[[run]]
id = "t_sonnet.v_sonnet"
labels = { pipeline = "agentic", tmodel = "sonnet", vmodel = "sonnet" }
from = "t_sonnet"
stages = ["verify"]
model = "sonnet"

[[run]]
id = "t_sonnet.v_opus"
labels = { pipeline = "agentic", tmodel = "sonnet", vmodel = "opus" }
from = "t_sonnet"
stages = ["verify"]
model = "opus"

# A verify experiment may narrow the parent's program set — useful for an
# expensive configuration you only want to try on one program.
[[run]]
id = "t_sonnet.v_sonnet_gtest_fuzz"
labels = { pipeline = "agentic", tmodel = "sonnet", vmodel = "sonnet", harness = "gtest+fuzz" }
from = "t_sonnet"
programs = ["lz4"]
stages = ["verify"]
model = "sonnet"
verify_harness = "gtest"
fuzz = true

# ---------------------------------------------------------------------------
# Prompt ablation: same model, same programs, plan files disabled. Isolating
# the anti-compaction mechanism is the point, so nothing else varies.
#
# Note this run cannot also set verify_harness/fuzz: the gtest verify harness
# is only active when plan files are enabled, so the combination would record
# gtest in its identity while actually verifying via libloading. The loader
# rejects it rather than let a mislabelled row into the table.
# ---------------------------------------------------------------------------

[[run]]
id = "t_sonnet_no_plan"
labels = { pipeline = "agentic", tmodel = "sonnet", prompt = "no_plan" }
programs = ["lz4", "jansson"]
stages = ["translate"]
model = "sonnet"
no_plan = true

[[run]]
id = "t_sonnet_no_plan.v_sonnet"
labels = { pipeline = "agentic", tmodel = "sonnet", vmodel = "sonnet", prompt = "no_plan" }
from = "t_sonnet_no_plan"
stages = ["verify"]
model = "sonnet"
no_plan = true

# ---------------------------------------------------------------------------
# A non-Anthropic model through OpenCode, to show that the agent/model axis is
# just another knob. Uses the CLI's own `oc` alias.
# ---------------------------------------------------------------------------

[[run]]
id = "t_oc_sonnet5_bedrock"
labels = { pipeline = "agentic", tmodel = "bedrock-sonnet-5", harness = "opencode" }
programs = ["lz4"]
stages = ["translate"]
agent = "oc"
model = "amazon-bedrock/us.anthropic.claude-sonnet-5"
